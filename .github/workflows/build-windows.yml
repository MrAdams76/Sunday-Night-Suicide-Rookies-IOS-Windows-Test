name: Build Windows Test Game

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Windows test repository
        uses: actions/checkout@v4

      - name: Check access to private iOS source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SNS_SOURCE_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw "Missing SNS_SOURCE_TOKEN secret. Add a GitHub token with Contents: Read access to the private iOS repository." }
          gh auth status

      - name: Checkout shared iOS project scripts
        uses: actions/checkout@v4
        with:
          repository: MrAdams76/Sunday-Night-Suicide-Rookies-IOS-
          ref: claude/ios-camera-touch-shader-fixes
          token: ${{ secrets.SNS_SOURCE_TOKEN }}
          path: ios-source

      - name: Checkout Psych Engine
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/DaffyToons/FNF-PsychEngine-0.6.3-Mobile.git engine
          if ($LASTEXITCODE -ne 0) { throw "Psych Engine checkout failed" }

      - name: Install Haxe toolchain
        shell: pwsh
        run: |
          choco install haxe --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Haxe installation failed" }
          # Chocolatey installs Neko in a separate directory. Its shim alone
          # cannot locate std.ndll, which every haxelib command requires.
          $nekoDll = Get-ChildItem 'C:\ProgramData\chocolatey\lib\neko' -Filter std.ndll -Recurse -File | Select-Object -First 1
          if (-not $nekoDll) { throw "Neko std.ndll not found after Chocolatey installation" }
          $nekoDir = $nekoDll.DirectoryName
          $env:PATH = "$nekoDir;C:\ProgramData\chocolatey\bin;$env:PATH"
          $env:NEKOPATH = $nekoDir
          $nekoDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "NEKOPATH=$nekoDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Neko runtime directory: $nekoDir"
          haxe --version
          neko -version
          haxelib setup "$env:USERPROFILE\haxelib"
          if ($LASTEXITCODE -ne 0) { throw "haxelib setup failed: check Neko runtime" }
          haxelib install lime 8.2.2 --quiet
          haxelib install openfl 9.4.1 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install flixel-ui 2.4.0 --quiet
          haxelib install hscript 2.4.0 --quiet
          haxelib install hxCodec --quiet
          if ($LASTEXITCODE -ne 0) { throw "hxCodec installation failed" }
          haxelib install discord_rpc --quiet
          if ($LASTEXITCODE -ne 0) { throw "discord_rpc installation failed" }
          haxelib install hxcpp 4.3.2 --quiet
          haxelib set hxcpp 4.3.2
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit
          if ($LASTEXITCODE -ne 0) { throw "LuaJIT dependency failed" }

      - name: Download original SNS mod assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SNS_SOURCE_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force mod-download | Out-Null
          gh release download sns-ios-assets-v1 --repo MrAdams76/Sunday-Night-Suicide-Rookies-IOS- --pattern SNS-mobile-assets.zip --dir mod-download --clobber
          if ($LASTEXITCODE -ne 0) { throw "SNS asset download failed" }
          python ios-source/scripts/stage_sns_mod.py mod-download/SNS-mobile-assets.zip engine
          if ($LASTEXITCODE -ne 0) { throw "SNS asset staging failed" }

      - name: Normalize SNS mod layout and audit original gameplay effects
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json, shutil, re
          root = Path("engine/mods/Sunday-Night-Suicide")
          nested = root / "Sunday-Night-Suicide"
          if nested.exists():
              # The release archive includes a second complete mod tree. The
              # runtime must see exactly one canonical mods/<name>/ tree.
              print("Removing duplicated SNS mod subtree:", nested)
              shutil.rmtree(nested)
          assert not nested.exists(), "Duplicate mod tree survived cleanup"
          # Preserve original song Lua scripts. Psych Engine loads
          # mods/<active>/data/<song>/script.lua when LUA_ALLOWED is enabled.
          for song in ("melancholy", "twisted", "lunacy", "smile"):
              p = root / "data" / song / "script.lua"
              if not p.is_file():
                  raise RuntimeError(f"Missing original {song} Lua script: {p}")
              print(f"Original Lua script available: {p} ({p.stat().st_size} bytes)")
          twisted = (root / "data/twisted/script.lua").read_text(encoding="utf-8-sig")
          lunacy = (root / "data/lunacy/script.lua").read_text(encoding="utf-8-sig")
          for token in ("headshot", "head", "doTween", "setObjectCamera"):
              if token not in twisted:
                  raise RuntimeError(f"Twisted cinematic instruction missing: {token}")
          for token in ("initLuaShader", "setSpriteShader", "camHUD", "camGame"):
              if token not in lunacy:
                  raise RuntimeError(f"Lunacy shader/camera instruction missing: {token}")
          for relative in ("images/headshot.png", "shaders/color.frag",
                           "custom_events/Cinematics.lua"):
              if not (root / relative).is_file():
                  raise RuntimeError(f"Missing cinematic resource: {relative}")
          shader = (root / "shaders/color.frag").read_text(encoding="utf-8-sig")
          for uniform in ("a", "b", "c"):
              if not re.search(r"uniform\s+float\s+" + uniform + r"\s*[;=]", shader):
                  raise RuntimeError(f"Missing original color shader uniform {uniform}")
          print("Twisted head asset/tween commands, Lunacy shader/camera commands and uniforms verified")
          print("NOTE: Static audit only; in-game Lua execution, camera layering and timings need gameplay verification.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "SNS effect audit failed" }

      - name: Configure desktop mod and check charts
        shell: pwsh
        run: |
          $project = 'engine/Project.xml'
          $xml = Get-Content $project -Raw
          # Upstream Project.xml ships with fps="", which Lime rejects.
          # Mirror the validated iOS build's fps=60 normalization.
          if (-not $xml.Contains('fps=""')) { throw "Expected upstream empty fps attribute was not found" }
          $xml = $xml.Replace('fps=""', 'fps="60"')
          # Replace the complete title attribute. The upstream title contains
          # an apostrophe (Funkin'), so a regex accepting either quote as a
          # terminator corrupts the XML by leaving ': Psych Engine' behind.
          $titlePattern = '(<app\s+title=)"[^"]*"'
          $xml = [regex]::Replace($xml, $titlePattern, '$1"Sunday Night Suicide Rookies Windows Test"', [System.Text.RegularExpressions.RegexOptions]::None)
          if ($xml -notmatch '<app title="Sunday Night Suicide Rookies Windows Test" file=') { throw "Could not safely replace app title" }
          if (-not $xml.Contains('</project>')) { throw "Unexpected Project.xml format" }
          $xml = $xml.Replace('</project>', '  <assets path="mods/Sunday-Night-Suicide" rename="mods/Sunday-Night-Suicide" embed="false" />' + "`n</project>")
          # Keep UTF-8 encoding and validate the *actual* generated project.
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $project), $xml, (New-Object System.Text.UTF8Encoding($false)))
          # Print targeted diagnostics if Lime rejects this XML again.
          # Lime permits namespace-like asset tags that a generic XML parser does not.
          # Lime's Project.xml allows colon-prefixed tags (e.g. android:*)
          # without XML namespace declarations. Python's strict parser does not.
          # Strip those prefixes only in the validation copy, not in the file Lime reads.
          @'
          import pathlib
          import re
          import xml.etree.ElementTree as ET
          p = pathlib.Path("engine/Project.xml")
          source = p.read_text(encoding="utf-8-sig")
          # Normalize Lime-specific config:android tags in the validation copy.
          # Use single backslashes in Python raw regexes (not doubled ones).
          check = source.replace("<config:android", "<config_android").replace("</config:android", "</config_android")
          ET.fromstring(check)
          print("Project.xml passes XML well-formedness check (Lime-specific tag prefixes normalized)")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Project.xml first 45 lines:"
            Get-Content $project -TotalCount 45
            throw "Project.xml syntax invalid before Lime build"
          }
          foreach ($song in @('melancholy', 'twisted', 'lunacy', 'smile')) {
            $chart = "engine/mods/Sunday-Night-Suicide/data/$song/$song.json"
            if (-not (Test-Path $chart)) { throw "Missing chart: $chart" }
            Write-Host "Chart present: $song"
          }

      - name: Apply Windows compatibility patches
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          root = Path("engine")
          project = root / "Project.xml"
          xml = project.read_text(encoding="utf-8-sig")
          # Discord Rich Presence is optional for this offline test build.
          # The published discord_rpc haxelib lacks its bundled native header.
          # Remove the library entry and disable desktop RPC code paths.
          discord_lib = '<haxelib name="discord_rpc" if="desktop"/>'
          if discord_lib not in xml:
              raise RuntimeError("Expected discord_rpc haxelib entry not found")
          xml = xml.replace(discord_lib, '<!-- Windows test: optional Discord RPC disabled -->', 1)
          xml = xml.replace('<define name="DISCORD_ALLOWED"', '<define name="DISCORD_DISABLED"')
          # The upstream VLC video handler is absent on this Windows build.
          # Disable only the video feature to keep PlayState compiling.
          original = '<define name="VIDEOS_ALLOWED" if="windows || linux || android" unless="32bits"/>'
          replacement = '<!-- Windows test: VIDEOS_ALLOWED disabled (missing vlc.MP4Handler) -->'
          if original not in xml:
              raise RuntimeError("Expected VIDEOS_ALLOWED definition not found")
          xml = xml.replace(original, replacement, 1)
          project.write_text(xml, encoding="utf-8")

          # Preserve DiscordClient's public API for callers, but replace the
          # optional Discord native integration with a Windows-test no-op.
          discord = root / "source/Discord.hx"
          discord.write_text("""package;
          #if desktop
          import llua.Lua;
          import llua.State;
          class DiscordClient {
              public static var isInitialized:Bool = false;
              public function new() {}
              public static function initialize():Void { isInitialized = true; }
              public static function shutdown():Void { isInitialized = false; }
              public static function changePresence(details:String, state:Null<String>, ?smallImageKey:String, ?hasStartTimestamp:Bool, ?endTimestamp:Float):Void {}
              #if LUA_ALLOWED
              public static function addLuaCallbacks(lua:llua.State):Void {
                  Lua_helper.add_callback(lua, "changePresence", function(details:String, state:Null<String>, ?smallImageKey:String, ?hasStartTimestamp:Bool, ?endTimestamp:Float) {
                      changePresence(details, state, smallImageKey, hasStartTimestamp, endTimestamp);
                  });
              }
              #end
          }
          #end
          """, encoding="utf-8")

          sound = root / "source/flixel/system/FlxSound.hx"
          src = sound.read_text(encoding="utf-8-sig")
          # The bundled FlxSound uses an OpenFL-private SoundChannel.__source
          # field which is absent in the installed OpenFL version. Preserve
          # standard soundTransform updates, omit only unsupported pitch hack.
          pattern = r'(?ms)^\s*\@:privateAccess\s*\n\s*if\(_channel\.__source != null\)\s*\{.*?\n\s*\}'
          patched, count = re.subn(pattern, '\n            // Windows test: private SoundChannel pitch backend disabled', src, count=1)
          if count != 1:
              raise RuntimeError("Could not locate incompatible FlxSound pitch block")
          sound.write_text(patched, encoding="utf-8")
          print("Windows compatibility patches applied")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Windows compatibility patch failed" }

      - name: Port iOS SNS week discovery to Windows
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("engine/source/WeekData.hx")
          code = p.read_text(encoding="utf-8-sig")
          anchor = "\t\t#end\n\t}\n\n\tprivate static function addWeek("
          if code.count(anchor) != 1:
              raise RuntimeError("WeekData discovery anchor changed")
          addition = """
                  #if windows
                  // Windows counterpart of the iOS SNS week registration fallback.
                  // Discover directly from the packaged mod, not the vanilla weeks list.
                  var snsRoot:String = Paths.mods("Sunday-Night-Suicide/");
                  var snsWeeks:String = snsRoot + "weeks/";
                  if (FileSystem.exists(snsWeeks) && FileSystem.isDirectory(snsWeeks))
                  {
                      for (snsFile in FileSystem.readDirectory(snsWeeks))
                      {
                          if (StringTools.endsWith(snsFile, ".json"))
                          {
                              var snsName:String = snsFile.substr(0, snsFile.length - 5);
                              addWeek(snsName, snsWeeks + snsFile, snsRoot, originalLength, originalLength);
                          }
                      }
                      // Show only the SNS songs when its charts are installed.
                      if (FileSystem.exists(snsRoot + "data/melancholy/melancholy.json"))
                      {
                          var snsOnly:Array<String> = [];
                          for (key in weeksList)
                          {
                              var candidate = weeksLoaded.get(key);
                              if (candidate == null || candidate.songs == null) continue;
                              var found:Bool = false;
                              for (entry in candidate.songs)
                              {
                                  var title:String = Std.string(entry[0]).toLowerCase();
                                  if (title == "melancholy" || title == "twisted"
                                      || title == "lunacy" || title == "smile") found = true;
                              }
                              if (found) snsOnly.push(key);
                              else weeksLoaded.remove(key);
                          }
                          weeksList = snsOnly;
                      }
                      trace("SNS Windows: cwd=" + Sys.getCwd() + " weeks=" + weeksList.join(","));
                  }
                  else trace("SNS Windows: missing mod weeks at " + snsWeeks);
                  #end
          """
          # Indentation is cosmetic; retain original conditional compilation boundary.
          code = code.replace(anchor, addition + anchor, 1)
          p.write_text(code, encoding="utf-8")
          print("Windows SNS week registration fallback installed")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "SNS week integration failed" }

      - name: Make SNS the exclusive Windows game and prevent Freeplay crash
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json
          root = Path("engine")
          mod = root / "mods/Sunday-Night-Suicide"
          # The upstream WeekData loads stock week1/week2 first, which shadows
          # SNS week1/week2 by ID. The later fallback cannot replace them.
          # Short-circuit discovery on Windows with SNS-only weeks.
          week = root / "source/WeekData.hx"
          src = week.read_text(encoding="utf-8-sig")
          anchor = "weeksLoaded.clear();"
          if src.count(anchor) != 1:
              raise RuntimeError("WeekData reset anchor changed")
          inject = """
                  #if windows
                  // SNS Windows standalone: never register stock FNF weeks.
                  var snsDirectory:String = Paths.mods("Sunday-Night-Suicide/");
                  var snsWeekDirectory:String = snsDirectory + "weeks/";
                  if (!FileSystem.exists(snsWeekDirectory))
                      throw "SNS weeks missing: " + snsWeekDirectory;
                  for (snsId in ["week1", "week2"])
                  {
                      var snsPath:String = snsWeekDirectory + snsId + ".json";
                      if (!FileSystem.exists(snsPath)) throw "SNS week missing: " + snsPath;
                      var snsWeek:WeekFile = getWeekFile(snsPath);
                      if (snsWeek == null) throw "SNS invalid week: " + snsPath;
                      var snsData:WeekData = new WeekData(snsWeek, snsId);
                      snsData.folder = "Sunday-Night-Suicide";
                      if ((isStoryMode == null) ||
                          (isStoryMode && !snsData.hideStoryMode) ||
                          (!isStoryMode && !snsData.hideFreeplay))
                      {
                          weeksLoaded.set(snsId, snsData);
                          weeksList.push(snsId);
                      }
                  }
                  trace("SNS standalone weeks: " + weeksList.join(","));
                  return;
                  #end
          """
          src = src.replace(anchor, anchor + inject, 1)
          week.write_text(src, encoding="utf-8")
          # The engine must use the mod directory before resolving title/menu art.
          # It is normally set from modsList.txt, but also enforce it on desktop.
          title = root / "source/TitleState.hx"
          code = title.read_text(encoding="utf-8-sig")
          # Leave original title animation logic intact; mod art resolution is
          # handled by Paths.currentModDirectory and the staged logo/title assets.
          print("SNS-only WeekData installed; title state preserved for animation")
          # Validate all four songs and ensure stock song IDs aren't in SNS weeks.
          names = []
          for file in ("week1.json", "week2.json"):
              data = json.loads((mod / "weeks" / file).read_text(encoding="utf-8-sig"))
              names.extend(str(entry[0]).lower() for entry in data["songs"])
          if sorted(names) != sorted(["melancholy", "twisted", "lunacy", "smile"]):
              raise RuntimeError("SNS weeks do not contain exactly the four requested songs: " + str(names))
          print("SNS-only Freeplay catalog:", names)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "SNS standalone Freeplay patch failed" }

      - name: Compile Windows game
        shell: pwsh
        working-directory: engine
        run: |
          haxelib run lime build windows -release
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }

      - name: Package enabled SNS mod beside Windows executable
        shell: pwsh
        run: |
          $bin = 'engine/export/release/windows/bin'
          $source = 'engine/mods/Sunday-Night-Suicide'
          $target = Join-Path $bin 'mods/Sunday-Night-Suicide'
          if (-not (Test-Path $source)) { throw "Staged SNS mod missing: $source" }
          if (-not (Test-Path $bin)) { throw "Compiled Windows bin missing: $bin" }
          if (Test-Path (Join-Path $source 'Sunday-Night-Suicide')) { throw "Nested duplicate mod directory detected before packaging" }
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
          Copy-Item -Path $source -Destination $target -Recurse -Force
          # Psych Engine loads mods from the executable's working directory.
          # The previous artifact uploaded only bin/** without the staged mod.
          # Psych Engine 0.6.3 reads modsList.txt from the GAME ROOT,
          # not from inside mods/. WeekData and ModsMenuState both use this path.
          $modsList = Join-Path $bin 'modsList.txt'
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $modsList), "Sunday-Night-Suicide|1`n", (New-Object System.Text.UTF8Encoding($false)))
          # Ensure the package contains the enabled-mod manifest at its root.
          if (-not (Test-Path $modsList)) { throw "Root modsList.txt missing" }
          Write-Host "Root modsList.txt:"
          Get-Content $modsList
          foreach ($song in @('melancholy', 'twisted', 'lunacy', 'smile')) {
            $chart = Join-Path $target "data/$song/$song.json"
            if (-not (Test-Path $chart)) { throw "Packaged chart missing: $chart" }
          }
          if (Test-Path (Join-Path $target 'Sunday-Night-Suicide')) { throw "Duplicate mod tree was packaged" }
          foreach ($song in @('melancholy','twisted','lunacy','smile')) {
            if (-not (Test-Path (Join-Path $target "data/$song/script.lua"))) { throw "Lua script missing from packaged build: $song" }
          }
          if (-not (Test-Path (Join-Path $target 'images/headshot.png'))) { throw "Twisted headshot asset missing" }
          if (-not (Test-Path (Join-Path $target 'shaders/color.frag'))) { throw "Lunacy color shader missing" }
          $weeks = @(Get-ChildItem (Join-Path $target 'weeks') -Filter '*.json' -ErrorAction Stop)
          if ($weeks.Count -eq 0) { throw "Packaged SNS week definitions missing" }
          Write-Host "Packaged enabled SNS mod with $($weeks.Count) week definitions into $bin"
          Write-Host "Extract the full artifact ZIP before launching the executable."

      - name: Upload Windows game ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SNS-Rookies-Windows-Test
          path: engine/export/release/windows/bin/**
          if-no-files-found: error
          retention-days: 14
